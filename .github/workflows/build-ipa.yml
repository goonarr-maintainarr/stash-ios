name: Build IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload IPA to'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build unsigned Release .app
        run: |
          xcodebuild build \
            -project Stash.xcodeproj \
            -scheme Stash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/Stash.app build/Payload/
          cd build
          zip -r stash-ios-${{ inputs.release_tag }}.ipa Payload

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ inputs.release_tag }} build/stash-ios-${{ inputs.release_tag }}.ipa --clobber
