name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Validate
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build scheme
        run: |
          xcodebuild build \
            -project Stash.xcodeproj \
            -scheme Stash \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
